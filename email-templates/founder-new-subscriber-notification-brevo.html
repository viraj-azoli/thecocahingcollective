<!-- Internal notification sent to the founder on every new newsletter signup. -->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no"/>
<meta name="x-apple-disable-message-reformatting"/>
<title>New newsletter subscriber</title>
<style>
  body { margin:0; padding:0; }
  table { border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt; }
  img { border:0; outline:none; text-decoration:none; display:block; }
  a { text-decoration:none; }
  .ecw { width:100% !important; min-width:0 !important; }
</style>
</head>
<body style="margin:0;padding:0;background-color:#ede8dc;">

<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
  New newsletter subscriber: {{ contact.FIRSTNAME }} ({{ contact.EMAIL }})
</div>

<table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#ede8dc">
<tr><td align="center" style="padding:32px 16px;">

<!--[if mso]><table align="center" border="0" cellpadding="0" cellspacing="0" width="520"><tr><td><![endif]-->
<table role="presentation" align="center" width="520" border="0" cellpadding="0" cellspacing="0" class="ecw" style="max-width:520px;width:100%;">

  <tr>
    <td align="center" style="padding:8px 24px 20px;">
      <img src="https://www.thecoachingcollectiveonline.com/pages/pages/logo-green-crop.png" width="100" alt="The Coaching Collective" style="width:100px;height:auto;">
    </td>
  </tr>

  <tr>
    <td style="background-color:#ffffff;border:1px solid #e4dbc9;border-radius:16px;padding:36px 36px 32px;">

      <p style="margin:0 0 6px;font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:#377e49;">
        New subscriber
      </p>
      <p style="margin:0 0 24px;font-family:Georgia,'Times New Roman',serif;font-size:22px;line-height:1.3;color:#1a2e1c;">
        Someone just joined The Collective Letter
      </p>

      <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color:#f5f0e8;border-radius:10px;">
        <tr>
          <td style="padding:18px 20px;">
            <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding:0 0 8px;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#4a5e4d;width:70px;">Name</td>
                <td style="padding:0 0 8px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:700;color:#1a2e1c;">{{ contact.FIRSTNAME }}</td>
              </tr>
              <tr>
                <td style="padding:0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#4a5e4d;width:70px;">Email</td>
                <td style="padding:0;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:700;color:#1a2e1c;">{{ contact.EMAIL }}</td>
              </tr>
            </table>
          </td>
        </tr>
      </table>

      <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin-top:24px;">
        <tr>
          <td align="center" bgcolor="#1b5323" style="border-radius:40px;">
            <a href="mailto:{{ contact.EMAIL }}" style="display:inline-block;padding:12px 28px;font-family:Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;color:#ffffff;">
              Say hello
            </a>
          </td>
        </tr>
      </table>

    </td>
  </tr>

  <tr>
    <td align="center" style="padding:20px 24px 8px;">
      <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:11px;line-height:1.6;color:rgba(26,46,28,0.40);">
        Automated notification from The Coaching Collective's newsletter signup form.
      </p>
    </td>
  </tr>

</table>
<!--[if mso]></td></tr></table><![endif]-->

</td></tr>
</table>

</body>
</html>
