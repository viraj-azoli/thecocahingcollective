name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-static:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clear FTP Sync State
        run: |
          curl -s -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -Q "DELE public_html/.ftp-deploy-sync-state.json" "ftp://${{ secrets.FTP_SERVER }}/" || curl -s --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -Q "DELE public_html/.ftp-deploy-sync-state.json" "ftp://${{ secrets.FTP_SERVER }}/" || echo "No static sync state file found to delete"

      - name: Deploy static site to Hostinger root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tcco-app/**
            **/the-coaching-collective/**
            **/docs/**
            **/.claude/**
            **/.github/**
            **/scss/**
            **/gulpfile.js
            **/package*.json
            **/_redirects
            **/QUICK_TEST_CHECKLIST.md
            **/TESTING_GUIDE.md

  build-and-deploy-app:
    needs: deploy-static
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tcco-app

    steps:
      - uses: actions/checkout@v4

      - name: Clear FTP Sync State
        run: |
          curl -s -k --ftp-ssl --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -Q "DELE public_html/app/.ftp-deploy-sync-state.json" "ftp://${{ secrets.FTP_SERVER }}/" || curl -s --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -Q "DELE public_html/app/.ftp-deploy-sync-state.json" "ftp://${{ secrets.FTP_SERVER }}/" || echo "No app sync state file found to delete"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tcco-app/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy app to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: tcco-app/dist/
          server-dir: app/
          dangerous-clean-slate: false
