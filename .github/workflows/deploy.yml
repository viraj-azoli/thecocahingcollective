name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy-app:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: tcco-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tcco-app/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # Hostinger deploys the repository itself, and it runs AFTER this
      # workflow. Whatever is committed at app/ is therefore what ends up
      # live — the FTP upload below gets overwritten by it, and removing
      # app/ from the repo makes Hostinger prune the directory and take the
      # app offline. So the build has to be committed, not just uploaded.
      - name: Commit build output to app/
        run: |
          cd "$GITHUB_WORKSPACE"
          rm -rf app
          cp -R tcco-app/dist app
          if [ -z "$(git status --porcelain app/)" ]; then
            echo "app/ already matches this build"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          # [skip ci] stops this commit re-triggering the workflow; it still
          # reaches Hostinger, which is the point.
          git commit -m "Publish build output to app/ [skip ci]"
          git push

      - name: Deploy app to Hostinger
        id: ftp-deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: tcco-app/dist/
          server-dir: app/
          timeout: 60000

      # Hostinger's FTP occasionally times out on connect — retry once
      - name: Retry deploy on failure
        if: steps.ftp-deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: tcco-app/dist/
          server-dir: app/
          timeout: 60000
