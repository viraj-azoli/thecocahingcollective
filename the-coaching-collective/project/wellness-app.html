<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Coaching Collective — Member App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

<style>
:root{
  --green:#1F5F4A;
  --green-dark:#1A5843;
  --green-2:#3D7560;
  --green-3:#6FA898;
  --green-soft:#E8F0EB;
  --cream:#F5EFDC;
  --cream-mid:#EEE9DF;
  --cream-dark:#E8E3D5;
  --tan:#DDD5BE;
  --tan-dark:#C9BFA6;
  --ink:#181817;
  --ink-2:#3A3A39;
  --gray:#6B6B69;
  --gray-light:#9E9E9C;
  --white:#FFFFFF;
  --off-white:#FAF8F4;
  --accent:#CD512F;
  --warning:#D4A45A;
  --info:#5A8FB4;

  --sans:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --serif:'Cormorant Garamond', Georgia, serif;

  --r-sm:6px;
  --r:10px;
  --r-lg:16px;
  --r-xl:24px;

  --shadow-sm: 0 1px 2px rgba(24,24,23,0.04), 0 1px 3px rgba(24,24,23,0.03);
  --shadow: 0 4px 12px rgba(24,24,23,0.05), 0 1px 3px rgba(24,24,23,0.04);
  --shadow-lg: 0 20px 40px -16px rgba(24,24,23,0.12), 0 4px 12px rgba(24,24,23,0.05);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--sans);
  background:var(--cream);
  color:var(--ink);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;color:inherit;}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}

/* ---------- LAYOUT ---------- */
.app{
  display:grid;
  grid-template-columns:248px 1fr;
  height:100vh;
  width:100vw;
  background:var(--cream);
}

/* ---------- SIDEBAR ---------- */
.sidebar{
  background:var(--green);
  color:var(--cream);
  padding:28px 20px 20px;
  display:flex;
  flex-direction:column;
  gap:32px;
  position:relative;
  overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:0;}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 6px;
}
.brand-mark{
  width:38px;height:38px;
  border-radius:50%;
  background:var(--cream);
  color:var(--green);
  display:grid;place-items:center;
  font-family:var(--serif);
  font-weight:600;
  font-size:18px;
  font-style:italic;
}
.brand-text{
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  font-weight:500;
  line-height:1.3;
}
.brand-text strong{display:block;font-weight:600;letter-spacing:0.12em;}

.nav-section{display:flex;flex-direction:column;gap:2px;}
.nav-label{
  font-size:10px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  opacity:0.55;
  padding:0 12px 8px;
  font-weight:600;
}
.nav-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  border-radius:var(--r-sm);
  font-size:13px;
  color:var(--cream);
  opacity:0.78;
  cursor:pointer;
  transition:all 0.18s ease;
  position:relative;
  font-weight:500;
}
.nav-item:hover{opacity:1;background:rgba(255,255,255,0.06);}
.nav-item.active{
  opacity:1;
  background:rgba(255,255,255,0.12);
  font-weight:600;
}
.nav-item.active::before{
  content:"";
  position:absolute;left:-20px;top:6px;bottom:6px;
  width:3px;background:var(--cream);border-radius:0 2px 2px 0;
}
.nav-item .badge{
  margin-left:auto;
  background:var(--accent);
  color:var(--white);
  font-size:10px;
  padding:2px 7px;
  border-radius:10px;
  font-weight:600;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}

.sidebar-footer{
  margin-top:auto;
  border-top:1px solid rgba(255,255,255,0.1);
  padding-top:16px;
}
.tier-card{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:var(--r);
  padding:14px;
  font-size:12px;
}
.tier-card .tier-label{
  font-size:10px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  opacity:0.7;
  margin-bottom:4px;
}
.tier-card .tier-name{
  font-family:var(--serif);
  font-size:18px;
  font-style:italic;
  font-weight:500;
  margin-bottom:8px;
}
.tier-card .tier-meta{font-size:11px;opacity:0.7;margin-bottom:10px;}
.tier-card .tier-bar{height:4px;background:rgba(255,255,255,0.15);border-radius:2px;overflow:hidden;}
.tier-card .tier-bar > div{height:100%;background:var(--cream);width:62%;}

/* ---------- TOPBAR ---------- */
.main-col{
  display:flex;flex-direction:column;
  overflow:hidden;
  background:var(--cream);
}
.topbar{
  height:68px;
  background:var(--white);
  border-bottom:1px solid var(--cream-dark);
  display:flex;
  align-items:center;
  padding:0 32px;
  gap:24px;
  flex-shrink:0;
}
.topbar-title{
  display:flex;flex-direction:column;
  line-height:1.2;
}
.topbar-title .crumb{
  font-size:10px;
  letter-spacing:0.16em;
  text-transform:uppercase;
  color:var(--gray);
  font-weight:500;
}
.topbar-title h1{
  margin:2px 0 0;
  font-size:20px;
  font-weight:600;
  color:var(--ink);
  letter-spacing:0;
}
.search{
  margin-left:auto;
  display:flex;align-items:center;
  gap:8px;
  background:var(--cream-mid);
  border:1px solid var(--cream-dark);
  padding:8px 14px;
  border-radius:999px;
  width:280px;
  color:var(--gray);
  font-size:13px;
}
.search input{
  border:none;background:none;outline:none;
  flex:1;font-size:13px;
  color:var(--ink);
}
.search input::placeholder{color:var(--gray-light);}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:38px;height:38px;
  border-radius:50%;
  display:grid;place-items:center;
  color:var(--ink-2);
  position:relative;
}
.icon-btn:hover{background:var(--cream-mid);}
.icon-btn .dot{
  position:absolute;top:9px;right:9px;
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  border:2px solid var(--white);
}
.user-chip{
  display:flex;align-items:center;gap:10px;
  padding:6px 14px 6px 6px;
  border-radius:999px;
  background:var(--cream-mid);
  border:1px solid var(--cream-dark);
  cursor:pointer;
}
.user-chip:hover{background:var(--cream-dark);}
.avatar{
  border-radius:50%;
  background:var(--green-soft);
  color:var(--green);
  display:grid;place-items:center;
  font-weight:600;
  font-size:13px;
  overflow:hidden;
  position:relative;
  flex-shrink:0;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.user-chip .avatar{width:30px;height:30px;}
.user-chip .name{font-size:12px;font-weight:600;color:var(--ink);}

/* ---------- SCROLL AREA ---------- */
.screen-wrap{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  background:var(--cream);
}
.screen-wrap::-webkit-scrollbar{width:10px;}
.screen-wrap::-webkit-scrollbar-track{background:var(--cream);}
.screen-wrap::-webkit-scrollbar-thumb{background:var(--tan);border-radius:10px;border:2px solid var(--cream);}
.screen{
  max-width:1280px;
  margin:0 auto;
  padding:32px 40px 80px;
}

/* ---------- COMMON ---------- */
.eyebrow{
  font-size:10px;
  letter-spacing:0.2em;
  text-transform:uppercase;
  color:var(--green-2);
  font-weight:600;
}
.section-title{
  font-size:13px;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--ink);
  font-weight:600;
  margin:0;
}
.section-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;
}
.section-head .link{font-size:12px;color:var(--green-2);font-weight:500;}
.section-head .link:hover{color:var(--green);}
.card{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-lg);
  padding:20px;
}
.card.flush{padding:0;overflow:hidden;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 20px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  letter-spacing:0.05em;
  transition:all 0.18s ease;
  white-space:nowrap;
  cursor:pointer;
}
.btn-primary{background:var(--green);color:var(--cream);}
.btn-primary:hover{background:var(--green-dark);}
.btn-ghost{background:transparent;color:var(--green);border:1px solid var(--green);}
.btn-ghost:hover{background:var(--green-soft);}
.btn-soft{background:var(--green-soft);color:var(--green);}
.btn-soft:hover{background:#dbe7df;}
.btn-dark{background:var(--ink);color:var(--cream);}
.btn-dark:hover{background:#2a2a28;}
.btn-sm{padding:6px 14px;font-size:11px;}
.btn-lg{padding:14px 28px;font-size:13px;}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;
  border-radius:999px;
  background:var(--cream-mid);
  color:var(--ink-2);
  font-size:11px;
  font-weight:500;
  border:1px solid var(--cream-dark);
}
.chip.green{background:var(--green-soft);color:var(--green);border-color:#cfddd5;}
.chip.tan{background:var(--cream);color:var(--ink-2);border-color:var(--tan);}
.chip.accent{background:#FCE9E2;color:var(--accent);border-color:#F4CFC3;}
.chip.dark{background:var(--ink);color:var(--cream);border-color:var(--ink);}

.dot-sep{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--gray-light);vertical-align:middle;margin:0 8px;}

/* ---------- SCREEN: DASHBOARD ---------- */
.greet-hero{
  background:linear-gradient(135deg, var(--green) 0%, var(--green-dark) 60%, #14483a 100%);
  border-radius:var(--r-xl);
  padding:36px 40px;
  color:var(--cream);
  display:grid;
  grid-template-columns:1fr 320px;
  gap:24px;
  position:relative;
  overflow:hidden;
  margin-bottom:28px;
}
.greet-hero::after{
  content:"";
  position:absolute;
  right:-80px;top:-80px;
  width:260px;height:260px;
  border:1px solid rgba(245,239,220,0.18);
  border-radius:50%;
}
.greet-hero::before{
  content:"";
  position:absolute;
  right:20px;bottom:-120px;
  width:200px;height:200px;
  border:1px solid rgba(245,239,220,0.12);
  border-radius:50%;
}
.greet-hero .greet-eye{
  font-size:10px;letter-spacing:0.22em;text-transform:uppercase;
  opacity:0.75;margin-bottom:10px;font-weight:500;
}
.greet-hero h2{
  font-family:var(--serif);
  font-size:38px;
  font-weight:400;
  font-style:italic;
  margin:0 0 14px;
  line-height:1.15;
  letter-spacing:-0.01em;
}
.greet-hero p{margin:0 0 22px;opacity:0.85;font-size:14px;max-width:480px;line-height:1.65;}
.greet-cta{display:flex;gap:10px;flex-wrap:wrap;}
.greet-cta .btn-primary{background:var(--cream);color:var(--green);}
.greet-cta .btn-primary:hover{background:var(--white);}
.greet-cta .btn-ghost{color:var(--cream);border-color:rgba(245,239,220,0.4);}
.greet-cta .btn-ghost:hover{background:rgba(245,239,220,0.08);}

.intention-card{
  background:rgba(245,239,220,0.08);
  border:1px solid rgba(245,239,220,0.18);
  border-radius:var(--r-lg);
  padding:18px;
  font-size:12px;
  position:relative;
  z-index:1;
}
.intention-card .ic-label{
  font-size:10px;letter-spacing:0.18em;text-transform:uppercase;
  opacity:0.7;margin-bottom:8px;font-weight:500;
}
.intention-card .ic-text{
  font-family:var(--serif);
  font-style:italic;
  font-size:18px;
  line-height:1.35;
  margin-bottom:14px;
}
.intention-card .ic-meta{
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;opacity:0.75;
}
.intention-card button{
  font-size:11px;color:var(--cream);
  text-decoration:underline;text-underline-offset:3px;
}

.dash-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:20px;
  margin-bottom:28px;
}
.stat-card{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-lg);
  padding:18px;
}
.stat-card .stat-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.stat-card .stat-icon{
  width:32px;height:32px;border-radius:8px;
  display:grid;place-items:center;
  background:var(--green-soft);color:var(--green);
}
.stat-card.warm .stat-icon{background:#FCE9E2;color:var(--accent);}
.stat-card.cream-bg{background:var(--cream-mid);}
.stat-card .stat-label{
  font-size:10px;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--gray);font-weight:600;
}
.stat-card .stat-value{
  font-size:28px;font-weight:300;
  letter-spacing:-0.01em;color:var(--ink);
  line-height:1;margin-bottom:4px;
  font-family:var(--serif);
}
.stat-card .stat-sub{font-size:11px;color:var(--gray);margin-top:6px;}
.stat-card .stat-trend{
  display:inline-flex;align-items:center;gap:3px;
  font-size:10px;font-weight:600;
  color:var(--green-2);
  background:var(--green-soft);
  padding:2px 7px;border-radius:999px;
}

.spark{display:flex;align-items:flex-end;gap:3px;height:24px;margin-top:8px;}
.spark span{flex:1;background:var(--green-3);border-radius:1px;opacity:0.4;}
.spark span.hi{opacity:1;background:var(--green);}

.split-2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:28px;}
.split-3{display:grid;grid-template-columns:repeat(3, 1fr);gap:20px;}

.session-strip{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-lg);
  padding:20px;
  display:flex;
  gap:16px;
  align-items:center;
}
.session-strip .session-time{
  width:88px;flex-shrink:0;text-align:center;
  border-right:1px solid var(--cream-dark);padding-right:16px;
}
.session-strip .session-time .day{
  font-size:10px;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--gray);font-weight:600;
}
.session-strip .session-time .hour{
  font-family:var(--serif);
  font-size:22px;font-weight:500;
  color:var(--green);margin:2px 0;
}
.session-strip .session-time .dur{font-size:11px;color:var(--gray);}
.session-strip .session-coach{display:flex;align-items:center;gap:12px;flex:1;}
.session-strip .avatar{width:44px;height:44px;font-size:14px;}
.session-strip .session-info .title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px;}
.session-strip .session-info .meta{font-size:12px;color:var(--gray);}
.session-strip .session-actions{display:flex;gap:8px;flex-shrink:0;}

.mood-card .mood-options{
  display:flex;gap:10px;margin:12px 0 14px;
}
.mood-options button{
  flex:1;
  padding:14px 6px;
  border-radius:var(--r);
  background:var(--cream-mid);
  border:1px solid var(--cream-dark);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:10px;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--gray);font-weight:600;
  transition:all 0.18s ease;
}
.mood-options button:hover{background:var(--cream-dark);}
.mood-options button.on{
  background:var(--green);color:var(--cream);border-color:var(--green);
}
.mood-circle{
  width:24px;height:24px;border-radius:50%;
}
.mood-options .m1 .mood-circle{background:#B85C5C;}
.mood-options .m2 .mood-circle{background:#D49C5C;}
.mood-options .m3 .mood-circle{background:var(--warning);}
.mood-options .m4 .mood-circle{background:var(--green-3);}
.mood-options .m5 .mood-circle{background:var(--green);}

.action-tile{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-lg);
  padding:20px;
  display:flex;flex-direction:column;
  gap:10px;
  cursor:pointer;
  transition:all 0.18s ease;
}
.action-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--tan-dark);}
.action-tile .at-icon{
  width:40px;height:40px;border-radius:10px;
  display:grid;place-items:center;
  background:var(--green-soft);color:var(--green);
}
.action-tile.tan{background:var(--cream-mid);}
.action-tile.tan .at-icon{background:var(--green);color:var(--cream);}
.action-tile.dark{background:var(--ink);color:var(--cream);border-color:var(--ink);}
.action-tile.dark .at-icon{background:rgba(245,239,220,0.1);color:var(--cream);}
.action-tile h4{
  font-size:14px;font-weight:600;margin:6px 0 2px;
  color:inherit;letter-spacing:0;text-transform:none;font-family:var(--sans);
}
.action-tile p{font-size:12px;color:var(--gray);margin:0;opacity:0.9;}
.action-tile.dark p{color:var(--cream);opacity:0.7;}

/* recommended cards */
.rec-card{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-lg);
  overflow:hidden;
  display:flex;flex-direction:column;
  cursor:pointer;
  transition:all 0.18s ease;
}
.rec-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.rec-card .rc-img{
  aspect-ratio:16/9;
  background:var(--green-soft);
  position:relative;
  overflow:hidden;
}
.rec-card .rc-img img{width:100%;height:100%;object-fit:cover;}
.rec-card .rc-tag{
  position:absolute;top:12px;left:12px;
  background:rgba(24,24,23,0.75);
  color:var(--cream);
  font-size:10px;letter-spacing:0.12em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;font-weight:600;
  backdrop-filter:blur(8px);
}
.rec-card .rc-body{padding:16px;}
.rec-card .rc-title{font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink);}
.rec-card .rc-meta{font-size:11px;color:var(--gray);display:flex;gap:8px;align-items:center;}

/* ---------- SCREEN: COACHES ---------- */
.filter-bar{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-lg);
  padding:16px 20px;
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  margin-bottom:24px;
}
.filter-bar .fb-label{font-size:11px;font-weight:600;color:var(--gray);letter-spacing:0.06em;text-transform:uppercase;margin-right:6px;}
.filter-chip{
  padding:7px 14px;border-radius:999px;
  background:var(--cream-mid);
  border:1px solid var(--cream-dark);
  font-size:12px;color:var(--ink-2);font-weight:500;
  cursor:pointer;transition:all 0.15s ease;
}
.filter-chip:hover{background:var(--cream-dark);}
.filter-chip.active{background:var(--green);color:var(--cream);border-color:var(--green);}
.filter-bar .right{margin-left:auto;display:flex;gap:8px;align-items:center;}

.coach-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:20px;
}
.coach-card{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-lg);
  overflow:hidden;
  cursor:pointer;
  transition:all 0.2s ease;
  display:flex;flex-direction:column;
}
.coach-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.coach-card .cc-img{
  aspect-ratio:4/3;
  background:linear-gradient(135deg, var(--green-soft), var(--cream-mid));
  position:relative;
  overflow:hidden;
}
.coach-card .cc-img img{width:100%;height:100%;object-fit:cover;filter:saturate(0.85);}
.coach-card .cc-fav{
  position:absolute;top:12px;right:12px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,0.95);
  display:grid;place-items:center;
  color:var(--ink-2);
}
.coach-card .cc-avail{
  position:absolute;bottom:12px;left:12px;
  background:rgba(255,255,255,0.95);
  font-size:10px;letter-spacing:0.12em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;font-weight:600;
  color:var(--green);
  display:inline-flex;align-items:center;gap:6px;
}
.coach-card .cc-avail .pulse{
  width:6px;height:6px;border-radius:50%;background:var(--green-3);
  box-shadow:0 0 0 3px rgba(111,168,152,0.3);
}
.coach-card .cc-body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1;}
.coach-card .cc-name{
  font-size:16px;font-weight:600;color:var(--ink);
  display:flex;justify-content:space-between;align-items:baseline;
}
.coach-card .cc-name .price{
  font-family:var(--serif);font-size:18px;font-weight:500;color:var(--green);
  letter-spacing:-0.01em;
}
.coach-card .cc-name .price small{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);font-family:var(--sans);margin-left:3px;}
.coach-card .cc-title{font-size:12px;color:var(--gray);}
.coach-card .cc-tags{display:flex;flex-wrap:wrap;gap:6px;}
.coach-card .cc-foot{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:12px;border-top:1px solid var(--cream-dark);margin-top:auto;
}
.coach-card .cc-rating{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:5px;}

/* ---------- SCREEN: PROFILE ---------- */
.profile-hero{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-xl);
  overflow:hidden;
  margin-bottom:24px;
  display:grid;
  grid-template-columns:340px 1fr;
}
.profile-hero .ph-img{
  background:var(--green-soft);
  position:relative;overflow:hidden;
}
.profile-hero .ph-img img{width:100%;height:100%;object-fit:cover;}
.profile-hero .ph-body{padding:32px;display:flex;flex-direction:column;gap:14px;}
.profile-hero .ph-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.profile-hero h2{
  font-family:var(--serif);
  font-weight:500;font-style:italic;
  font-size:32px;color:var(--ink);
  margin:0;letter-spacing:-0.01em;line-height:1.15;
}
.profile-hero .ph-title{font-size:13px;color:var(--gray);margin-top:4px;}
.profile-hero .ph-cred{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap;}
.profile-hero .ph-cred span{display:inline-flex;align-items:center;gap:6px;}
.profile-hero .ph-tags{display:flex;flex-wrap:wrap;gap:6px;}
.profile-hero .ph-bio{font-size:13px;color:var(--ink-2);line-height:1.7;}
.profile-hero .ph-actions{display:flex;gap:10px;margin-top:auto;padding-top:16px;border-top:1px solid var(--cream-dark);}
.profile-hero .ph-price{
  text-align:right;
}
.profile-hero .ph-price .num{
  font-family:var(--serif);font-size:32px;font-weight:500;
  color:var(--green);letter-spacing:-0.01em;
}
.profile-hero .ph-price .lbl{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);}

.tabs{
  display:flex;gap:4px;
  border-bottom:1px solid var(--cream-dark);
  margin-bottom:20px;
}
.tabs button{
  padding:12px 18px;
  font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
  color:var(--gray);
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.tabs button:hover{color:var(--ink);}
.tabs button.on{color:var(--green);border-bottom-color:var(--green);}

/* booking pane */
.booking-pane{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-lg);
  padding:24px;
}
.steps{display:flex;gap:8px;margin-bottom:24px;}
.step{flex:1;}
.step .s-num{
  width:24px;height:24px;border-radius:50%;
  background:var(--cream-mid);color:var(--gray);
  display:grid;place-items:center;
  font-size:11px;font-weight:700;
  margin-bottom:8px;
}
.step.done .s-num{background:var(--green);color:var(--cream);}
.step.active .s-num{background:var(--green);color:var(--cream);box-shadow:0 0 0 4px var(--green-soft);}
.step .s-label{font-size:11px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:0.06em;}
.step.active .s-label{color:var(--green);}
.step.done .s-label{color:var(--ink-2);}
.step .s-bar{height:2px;background:var(--cream-dark);margin-top:8px;}
.step.done .s-bar, .step.active .s-bar{background:var(--green);}
.step:last-child .s-bar{display:none;}

.calendar{
  border:1px solid var(--cream-dark);border-radius:var(--r);
  padding:16px;background:var(--off-white);
}
.cal-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px;
}
.cal-head .cal-month{font-size:13px;font-weight:600;}
.cal-head button{
  width:28px;height:28px;border-radius:6px;
  background:var(--white);border:1px solid var(--cream-dark);
  color:var(--ink-2);display:grid;place-items:center;
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{
  font-size:9px;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--gray);text-align:center;font-weight:600;padding:4px 0;
}
.cal-day{
  aspect-ratio:1;
  display:grid;place-items:center;
  font-size:12px;color:var(--ink-2);
  border-radius:8px;cursor:pointer;
  font-weight:500;
  position:relative;
}
.cal-day:hover{background:var(--cream-mid);}
.cal-day.dim{color:var(--gray-light);}
.cal-day.has::after{
  content:"";position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--green-2);
}
.cal-day.selected{background:var(--green);color:var(--cream);font-weight:600;}
.cal-day.selected::after{background:var(--cream);}

.time-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;
}
.time-slot{
  padding:10px 8px;text-align:center;
  border-radius:var(--r);background:var(--off-white);
  border:1px solid var(--cream-dark);
  font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer;
}
.time-slot:hover{border-color:var(--green-3);}
.time-slot.selected{background:var(--green);color:var(--cream);border-color:var(--green);}
.time-slot.busy{opacity:0.4;cursor:not-allowed;}

/* ---------- SCREEN: SESSIONS ---------- */
.session-list{display:flex;flex-direction:column;gap:14px;}
.session-row{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-lg);
  padding:20px;
  display:grid;
  grid-template-columns:80px 1fr auto;
  gap:20px;align-items:center;
}
.session-row .date-stack{text-align:center;border-right:1px solid var(--cream-dark);padding-right:20px;}
.session-row .date-stack .month{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--green-2);font-weight:600;}
.session-row .date-stack .day{font-family:var(--serif);font-size:32px;font-weight:500;color:var(--ink);line-height:1;}
.session-row .date-stack .wday{font-size:11px;color:var(--gray);margin-top:2px;}
.session-row .mid{display:flex;align-items:center;gap:14px;}
.session-row .avatar{width:42px;height:42px;font-size:14px;}
.session-row .info .stitle{font-size:14px;font-weight:600;margin-bottom:2px;}
.session-row .info .smeta{font-size:12px;color:var(--gray);}
.session-row .actions{display:flex;gap:8px;align-items:center;}

/* ---------- SCREEN: JOURNAL ---------- */
.journal-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}
.compose-card{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-lg);
  padding:24px;
}
.compose-card .cc-prompt{
  font-family:var(--serif);
  font-style:italic;
  font-size:22px;
  color:var(--green);
  line-height:1.3;
  margin-bottom:16px;
  letter-spacing:-0.01em;
}
.compose-card textarea{
  width:100%;
  min-height:160px;
  background:var(--off-white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r);
  padding:14px;
  font-size:13px;
  line-height:1.6;
  resize:vertical;
  outline:none;
  font-family:var(--sans);
}
.compose-card textarea:focus{border-color:var(--green-3);}
.compose-card .cc-foot{
  display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px;
}
.compose-card .cc-emotions{display:flex;gap:6px;flex-wrap:wrap;}

.entry-row{
  background:var(--white);border:1px solid var(--cream-dark);
  border-radius:var(--r);padding:14px 16px;
  display:flex;gap:12px;align-items:flex-start;
  margin-bottom:8px;
  cursor:pointer;
}
.entry-row:hover{border-color:var(--tan-dark);}
.entry-row .mood-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.entry-row .er-body{flex:1;}
.entry-row .er-meta{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gray);margin-bottom:3px;font-weight:600;}
.entry-row .er-text{font-size:12px;color:var(--ink-2);line-height:1.55;}

/* mood chart */
.chart-card{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-lg);
  padding:24px;
}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:160px;margin:18px 0;}
.bar-chart .bar{
  flex:1;background:var(--green-soft);border-radius:4px 4px 0 0;position:relative;
}
.bar-chart .bar.hi{background:var(--green);}
.bar-chart .bar.med{background:var(--green-3);}

/* ---------- SCREEN: LIBRARY ---------- */
.continue-card{
  background:linear-gradient(135deg, var(--green-2), var(--green));
  color:var(--cream);
  border-radius:var(--r-xl);
  padding:28px 32px;
  margin-bottom:28px;
  display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;
  position:relative;overflow:hidden;
}
.continue-card::after{
  content:"";position:absolute;right:-40px;top:50%;transform:translateY(-50%);
  width:200px;height:200px;border:1px solid rgba(245,239,220,0.2);border-radius:50%;
}
.continue-card .eye{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;opacity:0.8;margin-bottom:8px;font-weight:600;}
.continue-card h3{font-family:var(--serif);font-style:italic;font-size:26px;font-weight:500;margin:0 0 6px;letter-spacing:-0.01em;}
.continue-card .meta{font-size:13px;opacity:0.85;margin-bottom:14px;}
.continue-card .progress{
  height:4px;background:rgba(245,239,220,0.2);border-radius:2px;overflow:hidden;max-width:380px;
}
.continue-card .progress > div{height:100%;background:var(--cream);width:42%;}
.continue-card .play-btn{
  width:64px;height:64px;border-radius:50%;
  background:var(--cream);color:var(--green);
  display:grid;place-items:center;
  position:relative;z-index:1;
}

.program-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.program-card{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-lg);
  overflow:hidden;
  display:flex;flex-direction:column;
  cursor:pointer;
  transition:all 0.18s ease;
}
.program-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.program-card .pc-img{
  aspect-ratio:5/3;
  background:linear-gradient(135deg, var(--green-3), var(--green));
  position:relative;
  display:grid;place-items:center;
  color:var(--cream);
}
.program-card .pc-img.alt1{background:linear-gradient(135deg, #C7A674, var(--accent));}
.program-card .pc-img.alt2{background:linear-gradient(135deg, var(--green-2), var(--ink));}
.program-card .pc-img.alt3{background:linear-gradient(135deg, var(--tan-dark), var(--green-2));}
.program-card .pc-img.alt4{background:linear-gradient(135deg, var(--info), var(--green));}
.program-card .pc-img.alt5{background:linear-gradient(135deg, var(--warning), #C7A674);}
.program-card .pc-img .pc-icon{
  width:56px;height:56px;border-radius:50%;
  background:rgba(245,239,220,0.18);backdrop-filter:blur(4px);
  display:grid;place-items:center;
}
.program-card .pc-dur{
  position:absolute;bottom:10px;right:10px;
  background:rgba(24,24,23,0.7);color:var(--cream);
  font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;letter-spacing:0.06em;
}
.program-card .pc-body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1;}
.program-card .pc-cat{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--green-2);font-weight:600;}
.program-card .pc-title{font-size:15px;font-weight:600;color:var(--ink);}
.program-card .pc-meta{font-size:11px;color:var(--gray);margin-top:auto;padding-top:8px;}
.program-card.in-progress .pc-progress{
  height:3px;background:var(--cream-dark);position:relative;
}
.program-card.in-progress .pc-progress > div{
  height:100%;background:var(--green);
}

/* ---------- SCREEN: PROGRESS ---------- */
.streak-hero{
  background:var(--white);
  border:1px solid var(--cream-dark);
  border-radius:var(--r-xl);
  padding:32px;
  margin-bottom:24px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:32px;
  align-items:center;
}
.streak-hero .sh-num{
  font-family:var(--serif);
  font-size:96px;font-weight:300;
  color:var(--green);
  line-height:0.9;letter-spacing:-0.03em;
}
.streak-hero .sh-lbl{
  font-size:13px;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--gray);font-weight:600;margin-bottom:4px;
}
.streak-hero .sh-sub{font-size:14px;color:var(--ink-2);margin-top:4px;line-height:1.55;max-width:380px;}
.streak-hero .sh-cal{display:flex;gap:6px;margin-top:14px;}
.streak-hero .sh-cal > div{
  width:24px;aspect-ratio:1;border-radius:6px;background:var(--cream-mid);
  display:grid;place-items:center;font-size:9px;color:var(--gray-light);
}
.streak-hero .sh-cal > div.on{background:var(--green);color:var(--cream);font-weight:600;}
.streak-hero .sh-cal > div.today{background:var(--accent);color:var(--cream);font-weight:600;box-shadow:0 0 0 3px #FCE9E2;}

.milestone-list{display:flex;flex-direction:column;gap:10px;}
.milestone-row{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;background:var(--off-white);
  border:1px solid var(--cream-dark);border-radius:var(--r);
}
.milestone-row .ms-badge{
  width:40px;height:40px;border-radius:10px;
  background:var(--green-soft);color:var(--green);
  display:grid;place-items:center;flex-shrink:0;
}
.milestone-row.done .ms-badge{background:var(--green);color:var(--cream);}
.milestone-row .ms-info{flex:1;}
.milestone-row .ms-title{font-size:13px;font-weight:600;margin-bottom:2px;}
.milestone-row .ms-meta{font-size:11px;color:var(--gray);}
.milestone-row .ms-prog{font-size:11px;color:var(--green-2);font-weight:600;}

/* ---------- DEVICE INDICATORS ---------- */
@media (max-width: 1080px){
  .app{grid-template-columns:72px 1fr;}
  .sidebar{padding:24px 12px;}
  .brand-text, .nav-label, .nav-item span:not(.badge):not(svg), .tier-card{display:none;}
  .nav-item{justify-content:center;padding:12px;}
  .nav-item.active::before{display:none;}
  .brand{justify-content:center;}
  .dash-grid{grid-template-columns:repeat(2,1fr);}
  .split-2,.split-3,.coach-grid,.program-grid,.journal-grid{grid-template-columns:1fr;}
}
</style>
</head>
